# see https://docs.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops
# to check available agents
trigger:
- master
- review/*

schedules:
- cron: "0 0 * * *"
  displayName: Daily midnight build
  branches:
    include:
    - master
  always: true

jobs:
- template: conda-build.yml
  parameters:
    name: Ubuntu_24_04_python310
    vmImage: 'ubuntu-24.04'
    py_maj: 3
    py_min: 10
- template: conda-build.yml
  parameters:
    name: Ubuntu_24_04_python311
    vmImage: 'ubuntu-24.04'
    py_maj: 3
    py_min: 11
- template: conda-build.yml
  parameters:
    name: Ubuntu_24_04_python312
    vmImage: 'ubuntu-24.04'
    py_maj: 3
    py_min: 12
- template: conda-build.yml
  parameters:
    name: Ubuntu_24_04_python313
    vmImage: 'ubuntu-24.04'
    py_maj: 3
    py_min: 13
- template: conda-build.yml
  parameters:
    name: Ubuntu_24_04_python314
    vmImage: 'ubuntu-24.04'
    py_maj: 3
    py_min: 14

# ruff pinned: a new release may add rules or change the formatting
- job: Ruff
  pool:
    vmImage: 'ubuntu-24.04'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
  - bash: |
      set -ex
      python -m pip install ruff==0.16.8
      ruff check --output-format=azure .
      ruff format --check .
    displayName: 'ruff check and ruff format --check'
