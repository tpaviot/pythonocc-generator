#   name                     (required) the OCCT module name
#   additional_deps          extra modules to %include in the .i file
#   exclude_classes          class names to skip; ['*'] skips all
#   exclude_member_functions {class_name: [method, ...]} per-class blacklist
modules:
  - name: FSD
    exclude_classes: ["*"]

