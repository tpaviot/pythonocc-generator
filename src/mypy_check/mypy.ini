# Type check mypy_classic_occ_bottle.py against the generated .pyi stubs, the
# same check as the pythonocc-core conda recipe test. Once installed, the stubs
# live in site-packages where mypy does not report their own errors: ignore
# them here as well. Syntax errors in the stubs are still reported.
[mypy]

[mypy-OCC.*]
ignore_errors = True
